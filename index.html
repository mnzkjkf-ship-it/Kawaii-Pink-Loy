<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Pink Loy Krathong 🌸✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pink-main: #ff6b9d;
            --pink-soft: #ffb6c1;
            --pink-bg: #fff0f5;
            --pink-accent: #ff1493;
            --pink-glass: rgba(255, 182, 193, 0.25);
            --pink-card: rgba(255, 255, 255, 0.85);
            --purple-pastel: #e6e6fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Mali', 'Prompt', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffd1dc 0%, #ffe4e1 50%, #e6e6fa 100%);
            color: #5c3d46;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 25px 20px 10px;
            width: 100%;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--pink-accent);
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.3);
            margin-bottom: 5px;
        }

        header p {
            color: #8b4513;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.6);
            display: inline-block;
            padding: 4px 15px;
            border-radius: 20px;
        }

        .container {
            max-width: 900px;
            width: 95%;
            margin: 10px auto 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--pink-card);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .card-title {
            font-size: 1.3rem;
            color: var(--pink-accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Krathong Preview Section */
        .preview-box {
            background: radial-gradient(circle, #3a224a 0%, #1a0f26 100%);
            border-radius: 20px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 3px solid var(--pink-soft);
        }

        .moon {
            position: absolute;
            top: 15px;
            right: 25px;
            width: 45px;
            height: 45px;
            background: #ffe4e1;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffb6c1;
        }

        .krathong-visual {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .glow-effect {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            filter: blur(18px);
            opacity: 0.8;
            transition: background 0.5s ease;
        }

        .base-shape {
            position: absolute;
            bottom: 20px;
            font-size: 75px;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4));
        }

        .candle-flame {
            position: absolute;
            top: 15px;
            font-size: 24px;
            animation: flicker 0.8s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.15) rotate(2deg); opacity: 1; }
        }

        /* Color & Style Options */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .color-btn {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .color-btn:hover, .color-btn.active {
            transform: scale(1.2);
            border-color: var(--pink-accent);
        }

        .option-group {
            margin-bottom: 12px;
        }

        .option-group label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
            display: block;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .select-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid var(--pink-soft);
            background: #fff;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #5c3d46;
            transition: all 0.2s;
        }

        .select-btn.active {
            background: var(--pink-main);
            color: #fff;
            border-color: var(--pink-main);
        }

        /* Quiz Styling */
        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .question-box {
            font-weight: 600;
            color: #4a2c35;
            font-size: 1rem;
            background: #fff;
            padding: 12px 15px;
            border-radius: 15px;
            border-left: 5px solid var(--pink-main);
        }

        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .answer-btn {
            background: #fff;
            border: 2px solid #ffe4e1;
            padding: 10px 15px;
            border-radius: 15px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: #5c3d46;
        }

        .answer-btn:hover {
            border-color: var(--pink-soft);
            background: #fff0f5;
        }

        .answer-btn.correct {
            background: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
        }

        .answer-btn.wrong {
            background: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
        }

        .quiz-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .action-btn {
            background: linear-gradient(45deg, var(--pink-main), var(--pink-accent));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(255, 20, 147, 0.3);
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        .wish-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--pink-soft);
            border-radius: 15px;
            outline: none;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        /* Canvas Floating River Section */
        .river-section {
            grid-column: 1 / -1;
            text-align: center;
        }

        #riverCanvas {
            width: 100%;
            height: 250px;
            border-radius: 20px;
            background: linear-gradient(to bottom, #1d122c, #0d0614);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 Loy Krathong Pastel Pink ✨</h1>
        <p>ลอยกระทงเรืองแสงสีชมพูพาสเทล & ทายคำถามสนุกๆ</p>
    </header>

    <div class="container">
        <!-- Section 1: Customize Krathong -->
        <div class="card">
            <div class="card-title">✨ แต่งกระทงเปลี่ยนสีพาสเทล</div>
            
            <div class="preview-box">
                <div class="moon"></div>
                <div class="krathong-visual">
                    <div class="glow-effect" id="krathongGlow"></div>
                    <div class="base-shape" id="krathongBase">🪷</div>
                    <div class="candle-flame">🕯️</div>
                </div>
            </div>

            <div style="margin-top: 15px;">
                <div class="option-group">
                    <label>เลือกสีไฟ LED (7 สีมงคล):</label>
                    <div class="color-grid" id="colorPicker"></div>
                </div>

                <div class="option-group">
                    <label>เลือกแบบกระทงสุดน่ารัก:</label>
                    <div class="btn-group">
                        <button class="select-btn active" onclick="setBase('🪷', this)">ใบบัว 🪷</button>
                        <button class="select-btn" onclick="setBase('🍞', this)">ขนมปัง 🍞</button>
                        <button class="select-btn" onclick="setBase('🧸', this)">น้องหมี 🧸</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 2: Quiz Game -->
        <div class="card">
            <div class="card-title">❓ คำถามลอยกระทง (<span id="qNum">1</span>/6)</div>
            
            <div class="quiz-container">
                <div class="question-box" id="questionText">กำลังโหลดคำถาม...</div>
                <div class="answers-grid" id="answersBox"></div>
                
                <div class="quiz-nav">
                    <span style="font-size: 0.9rem; color: #888;">คะแนน: <b id="scoreText" style="color: var(--pink-accent);">0</b></span>
                    <button class="action-btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">ข้อต่อไป ➔</button>
                </div>
            </div>
        </div>

        <!-- Section 3: Floating River Canvas -->
        <div class="card river-section">
            <div class="card-title" style="justify-content: center;">🌊 สายน้ำอธิษฐานยามค่ำคืน</div>
            <input type="text" id="wishInput" class="wish-input" placeholder="พิมคำอธิษฐานขอพรพระแม่คงคาตรงนี้ได้เลยน้า... 💕">
            <button class="action-btn" onclick="floatKrathong()" style="font-size: 1.1rem; width: 100%; padding: 12px; margin-bottom: 15px;">
                🌸 ปล่อยกระทงลงแม่น้ำ 🌸
            </button>
            <canvas id="riverCanvas"></canvas>
        </div>
    </div>

    <script>
        // Data & Color Palette
        const colors = [
            { name: 'ชมพูบานเย็น', hex: '#ff1493' },
            { name: 'ฟ้าเทอร์ควอยซ์', hex: '#00e5ff' },
            { name: 'ม่วงพาสเทล', hex: '#b39ddb' },
            { name: 'เหลืองทอง', hex: '#ffd700' },
            { name: 'เขียวมรกต', hex: '#00e676' },
            { name: 'ส้มพาสเทล', hex: '#ff9e80' },
            { name: 'น้ำเงินคราม', hex: '#7c4dff' }
        ];

        const questions = [
            {
                q: "1. การลอยกระทงในคืนวันเพ็ญเดือน 12 จัดขึ้นเพื่ออะไร?",
                a: ["ขอขมาพระแม่คงคา", "ต้อนรับฤดูหนาว", "ฉลองวันขึ้นปีใหม่", "ขอฝนจากเทวดา"],
                correct: 0
            },
            {
                q: "2. นางนพมาศ หรือ ท้าวศรีจุฬาลักษณ์ เชื่อว่าเป็นผู้ประดิษฐ์กระทงรูปอะไรคนแรก?",
                a: ["รูปดอกบัว", "รูปหัวใจ", "รูปดาว", "รูปเรือ"],
                correct: 0
            },
            {
                q: "3. วัสดุใดที่เป็นมิตรกับสิ่งแวดล้อมมากที่สุดในการทำกระทง?",
                a: ["โฟม", "พลาสติก", "หยวกกล้วยและใบตอง", "ลวดเหล็ก"],
                correct: 2
            },
            {
                q: "4. งานลอยกระทงสายที่มีชื่อเสียงระดับประเทศจัดขึ้นที่จังหวัดใด?",
                a: ["เชียงใหม่", "ตาก", "สุโขทัย", "อยุธยา"],
                correct: 1
            },
            {
                q: "5. การใส่สิ่งใดลงในกระทงตามความเชื่อโบราณสื่อถึงการตัดทุกข์โศก?",
                a: ["ดอกไม้สด", "เหรียญกษาปณ์", "เส้นผมและเล็บ", "ลูกอม"],
                correct: 2
            },
            {
                q: "6. งานเผาเทียนเล่นไฟในวันลอยกระทงเป็นเอกลักษณ์ของจังหวัดใด?",
                a: ["สุโขทัย", "กรุงเทพฯ", "ภูเก็ต", "น่าน"],
                correct: 0
            }
        ];

        let selectedColor = colors[0].hex;
        let selectedBase = '🪷';
        let currentQ = 0;
        let score = 0;
        let floatingKrathongs = [];

        // Color Picker Init
        const colorPicker = document.getElementById('colorPicker');
        colors.forEach((c, index) => {
            const btn = document.createElement('button');
            btn.className = `color-btn ${index === 0 ? 'active' : ''}`;
            btn.style.backgroundColor = c.hex;
            btn.onclick = () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedColor = c.hex;
                updateKrathongPreview();
            };
            colorPicker.appendChild(btn);
        });

        function setBase(emoji, btn) {
            document.querySelectorAll('.select-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedBase = emoji;
            updateKrathongPreview();
        }

        function updateKrathongPreview() {
            const glow = document.getElementById('krathongGlow');
            glow.style.background = selectedColor;
            glow.style.boxShadow = `0 0 30px ${selectedColor}`;
            document.getElementById('krathongBase').innerText = selectedBase;
        }

        // Quiz System
        function loadQuestion() {
            const q = questions[currentQ];
            document.getElementById('qNum').innerText = currentQ + 1;
            document.getElementById('questionText').innerText = q.q;
            
            const answersBox = document.getElementById('answersBox');
            answersBox.innerHTML = '';
            document.getElementById('nextBtn').style.display = 'none';

            q.a.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, btn);
                answersBox.appendChild(btn);
            });
        }

        function checkAnswer(chosen, btn) {
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(b => b.disabled = true);
            
            const correct = questions[currentQ].correct;
            if (chosen === correct) {
                btn.classList.add('correct');
                score++;
                document.getElementById('scoreText').innerText = score;
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
            } else {
                btn.classList.add('wrong');
                btns[correct].classList.add('correct');
            }
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('questionText').innerText = `🎉 คุณตอบคำถามได้ ${score}/${questions.length} คะแนน!`;
                document.getElementById('answersBox').innerHTML = `<p style="text-align:center; padding:15px; color:var(--pink-accent);">แต่งกระทงและปล่อยลงแม่น้ำด้านล่างได้เลยน้า ✨</p>`;
                document.getElementById('nextBtn').style.display = 'none';
            }
        }

        // Canvas Simulation
        const canvas = document.getElementById('riverCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 40;
            canvas.height = 250;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function floatKrathong() {
            const wish = document.getElementById('wishInput').value || 'มีความสุข สดใส ✨';
            floatingKrathongs.push({
                x: canvas.width + 50,
                y: Math.random() * (canvas.height - 100) + 50,
                color: selectedColor,
                base: selectedBase,
                wish: wish,
                speed: Math.random() * 0.8 + 0.5,
                waveOffset: Math.random() * 100
            });
            document.getElementById('wishInput').value = '';
            confetti({ particleCount: 70, spread: 80, origin: { y: 0.8 } });
        }

        function animateRiver() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Stars & Pink Moon
            ctx.fillStyle = '#ffb6c1';
            ctx.beginPath();
            ctx.arc(canvas.width - 50, 40, 20, 0, Math.PI * 2);
            ctx.fill();

            // Draw Floating Krathongs
            floatingKrathongs.forEach((k, idx) => {
                k.x -= k.speed;
                const waveY = k.y + Math.sin((k.x + k.waveOffset) * 0.03) * 5;

                // Glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = k.color;
                ctx.fillStyle = k.color;
                ctx.beginPath();
                ctx.arc(k.x, waveY + 10, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Emoji
                ctx.font = '28px Mali';
                ctx.textAlign = 'center';
                ctx.fillText(k.base, k.x, waveY + 15);
                ctx.font = '16px Mali';
                ctx.fillText('🕯️', k.x, waveY - 5);

                // Wish Text
                ctx.font = '12px Prompt';
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fillText(k.wish, k.x, waveY + 35);
            });

            requestAnimationFrame(animateRiver);
        }

        // Initialize
        updateKrathongPreview();
        loadQuestion();
        animateRiver();
    </script>
</body>
</html>
